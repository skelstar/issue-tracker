# .github/workflows/release.yml
#
# Every merge to main builds an image and publishes a GitHub Release (tag v<version>) with
# release.json. It never deploys: Kraken (kraken.skelstar.io) reads the release and deploys it when
# you press the button. If Kraken is down, deploy by editing newTag and digest in
# Tatooine-Configuration/deployments/issue-tracker/k8s/kustomization.yaml.
#
# The version bump comes from labels on the pull request merged into main:
#   no label        minor  1.0.0 -> 1.1.0
#   release:patch   patch  1.0.0 -> 1.0.1
#   release:major   major  1.0.0 -> 2.0.0
#   release:skip    no release (the typecheck doesn't run either)
# More than one release:* label fails the run rather than guessing. A push to main without a
# pull request gets a minor bump. Run workflow by hand to release an explicit version instead.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "issue-tracker icons/**"
      - ".claude/**"
      - ".vscode/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version (e.g. 2.0.0). Leave blank to bump the minor version"
        required: false

# Releases are numbered from the latest tag, so never run two at once.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/skelstar/issue-tracker

jobs:
  # Decides the version bump from the merged pull request's release:* labels.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
    steps:
      - name: Read release label
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            # An explicit version, if given, wins in the release job; otherwise minor.
            echo "Run by hand"
            echo "bump=minor" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The pull request whose merge produced this commit on main.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "[.[] | select(.merged_at != null and .base.ref == \"main\")][0] // empty")
          if [[ -z "$pr" ]]; then
            echo "No merged pull request for $GITHUB_SHA; using a minor bump"
            echo "bump=minor" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          number=$(jq -r .number <<<"$pr")
          mapfile -t labels < <(jq -r '.labels[].name | select(startswith("release:"))' <<<"$pr")
          echo "PR #$number release labels: ${labels[*]:-none}"

          if [[ ${#labels[@]} -gt 1 ]]; then
            echo "::error::PR #$number has more than one release label (${labels[*]}). Keep one and re-run this workflow."
            exit 1
          fi

          case "${labels[0]:-}" in
            "")            bump=minor ;;
            release:patch) bump=patch ;;
            release:major) bump=major ;;
            release:skip)  bump=skip ;;
            *) echo "::error::Unknown label ${labels[0]} on PR #$number (expected release:patch, release:major or release:skip)"; exit 1 ;;
          esac
          echo "Bump: $bump"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.bump != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and GitHub Release
      packages: write # push to ghcr.io

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to work out the next version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # A commit that fails this never becomes an image or a release. There are no tests yet.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ github.event.inputs.version }}
          BUMP: ${{ needs.plan.outputs.bump }}
        run: |
          set -euo pipefail
          valid() { [[ "$1" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; }
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')

          if [[ -n "$REQUESTED" ]]; then
            valid "$REQUESTED" || { echo "::error::Version '$REQUESTED' must be X.Y.Z"; exit 1; }
            if [[ -n "$latest" ]] && [[ "$(printf '%s\n%s\n' "$latest" "$REQUESTED" | sort -V | tail -n1)" != "$REQUESTED" || "$REQUESTED" == "$latest" ]]; then
              echo "::error::Version $REQUESTED must be greater than the latest release $latest"; exit 1
            fi
            version="$REQUESTED"
          elif [[ -z "$latest" ]]; then
            version="1.0.0"
          else
            IFS=. read -r major minor patch <<<"$latest"
            case "$BUMP" in
              patch) version="$major.$minor.$((patch + 1))" ;;
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              *) echo "::error::Unexpected bump '$BUMP'"; exit 1 ;;
            esac
          fi

          echo "Latest release: ${latest:-none}. Bump: $BUMP. New release: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # release.json is what Kraken reads. The digest pins exactly what was built. Data is JSON
      # files on a volume with no schema, so there are never migrations.
      - name: Write release.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::No image digest from the build"; exit 1; }
          jq -n \
            --arg version "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg app "$IMAGE@$DIGEST" \
            '{project: "issue-tracker", version: $version, commit: $commit, migrations: false, images: {app: $app}}' \
            > release.json
          cat release.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" release.json \
            --target "$GITHUB_SHA" \
            --title "issue-tracker $VERSION" \
            --generate-notes
